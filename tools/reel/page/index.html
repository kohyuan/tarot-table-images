<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><title>タロットテーブル リール</title>
<link rel="stylesheet" href="../node_modules/@fontsource/zen-old-mincho/700.css">
<link rel="stylesheet" href="../node_modules/@fontsource/zen-kaku-gothic-new/500.css">
<link rel="stylesheet" href="../node_modules/@fontsource/marcellus/400.css">
<link rel="stylesheet" href="../node_modules/@fontsource/kaisei-decol/400.css">
<style>
  html, body { margin: 0; width: 1080px; height: 1920px; overflow: hidden; background: #0b1430; }
  /* アプリと同じ紺の夜空（globals.css の --sky） */
  #sky { position: absolute; inset: 0; background: linear-gradient(to bottom, #0b1430 0%, #132046 45%, #243060 80%, #34386e 100%); }
  .abs { position: absolute; left: 0; top: 0; will-change: transform, opacity; }
  .sub { width: 1080px; text-align: center; font: 500 40px 'Zen Kaku Gothic New', sans-serif; letter-spacing: .06em; color: #a3abc6; }
  .main { width: 1080px; text-align: center; font: 700 112px 'Zen Old Mincho', serif; letter-spacing: .12em; color: #f1e6cf; text-shadow: 0 0 40px rgba(230,207,156,.35); }
  /* カード：アプリと同じ 3:5。基準の大きさで作り、縮めて置く（拡大してもにじまないように） */
  .card { width: 560px; height: 933px; transform-origin: 50% 50%; border-radius: 30px; }
  .card .side { position: absolute; inset: 0; border-radius: 30px; overflow: hidden; box-shadow: 0 2px 4px rgba(0,0,0,.4), 0 40px 80px -10px rgba(0,0,0,.65); }
  .card .side img { width: 100%; height: 100%; display: block; object-fit: cover; }
  /* 仕上げ：外側の縁なし、絵の内側に金線、絵の下を暗くぼかした帯に金の文字（2026/9/28 の決定） */
  .face .line { position: absolute; inset: 22px; border: 2.5px solid rgba(230,200,130,.9); border-radius: 14px; box-shadow: 0 0 6px rgba(230,200,130,.35); }
  .face .band { position: absolute; left: 0; right: 0; bottom: 0; height: 210px; background: linear-gradient(to bottom, rgba(10,12,30,0) 0%, rgba(10,12,30,.72) 45%, rgba(10,12,30,.86) 100%); }
  .face .label { position: absolute; left: 0; right: 0; bottom: 58px; text-align: center; color: #e8c983; font: 700 52px 'Zen Old Mincho', serif; letter-spacing: .14em; text-shadow: 0 2px 8px rgba(0,0,0,.6); }
  .face .label .num { font: 400 40px 'Marcellus', serif; letter-spacing: .2em; margin-right: 22px; vertical-align: 4px; }
  .face .sheen { position: absolute; inset: 0; background: linear-gradient(105deg, transparent 35%, rgba(255,245,215,.35) 50%, transparent 65%); mix-blend-mode: screen; }
  .halo { width: 900px; height: 900px; border-radius: 50%; background: radial-gradient(circle, rgba(240,215,150,.32) 0%, rgba(240,215,150,.10) 38%, rgba(240,215,150,0) 68%); }
  .stop { left: 120px; width: 840px; box-sizing: border-box; text-align: center; padding: 30px 20px; border: 2px solid rgba(230,200,130,.75); border-radius: 60px; background: rgba(11,20,48,.72);
          font: 500 44px/1.5 'Zen Kaku Gothic New', sans-serif; color: #e9ecf5; letter-spacing: .04em; }
  .stop .pause { display: inline-block; margin-right: 16px; vertical-align: -4px; }
  .stop .pause i { display: inline-block; width: 11px; height: 40px; background: #e8c983; border-radius: 3px; margin: 0 4px; }
  .pos { width: 160px; text-align: center; font: 500 36px 'Zen Kaku Gothic New', sans-serif; color: #a3abc6; letter-spacing: .2em; }
  .cname { width: 1080px; text-align: center; font: 700 56px 'Zen Old Mincho', serif; color: #f1e6cf; letter-spacing: .1em; }
  .cname { white-space: nowrap; }
  .cname small { font: 500 .643em 'Zen Kaku Gothic New', sans-serif; color: #a3abc6; margin-left: .357em; letter-spacing: .1em; }
  .cname b { display: inline-block; margin-left: .464em; font: 700 .679em 'Zen Kaku Gothic New', sans-serif; color: #0f1a38; background: #e8c983; border-radius: 40px; padding: .158em .79em; vertical-align: .107em; }
  .read { left: 110px; width: 860px; text-align: center; font: 500 42px/1.75 'Zen Kaku Gothic New', sans-serif; color: #e9ecf5; word-break: auto-phrase; line-break: strict; }
  .mote { width: 8px; height: 8px; border-radius: 50%; background: #f6dfa4; box-shadow: 0 0 10px 3px rgba(246,223,164,.6); }
  /* 問い（考える時間の間だけ出す） */
  .q { left: 90px; width: 900px; text-align: center; font: 700 54px/1.6 'Zen Old Mincho', serif; color: #f1e6cf; letter-spacing: .04em; word-break: auto-phrase; line-break: strict; text-shadow: 0 0 24px rgba(230,207,156,.25); }
  .bar { left: 290px; width: 500px; height: 6px; border-radius: 3px; background: rgba(232,201,131,.22); overflow: hidden; }
  .bar i { display: block; height: 100%; width: 100%; background: #e8c983; transform-origin: 0 50%; }
  .kw { width: 320px; text-align: center; white-space: nowrap; font: 700 34px 'Zen Kaku Gothic New', sans-serif; color: #e8c983; letter-spacing: .1em; }
  /* 締め：アプリのホーム画面（page.module.css を縦長に約2.2倍） */
  .nameEn { width: 1080px; text-align: center; font: 400 34px 'Marcellus', serif; letter-spacing: .2em; color: #a3abc6; }
  .name { width: 1080px; text-align: center; font: 400 92px 'Kaisei Decol', serif; letter-spacing: .08em; color: #e9ecf5; }
  .lead { width: 1080px; text-align: center; font: 500 40px/2 'Zen Kaku Gothic New', sans-serif; color: #e9ecf5; }
  .btn { left: 190px; width: 700px; text-align: center; font: 700 40px 'Zen Kaku Gothic New', sans-serif; letter-spacing: .06em; padding: 44px 0; background: #e9ecf5; color: #0f1a38; border-radius: 3px; }
  .ring { width: 120px; height: 120px; border-radius: 50%; border: 6px solid rgba(255,255,255,.9); box-sizing: border-box; }
  /* 絵がまだ無いカードの仮の表面：紺の地に金の枠、番号と名前 */
  .face.plain { background: radial-gradient(ellipse at 50% 40%, #2c2554 0%, #1a1636 55%, #0f0c22 100%); }
  .face.plain .frame { position: absolute; inset: 22px; border: 2.5px solid rgba(230,200,130,.9); border-radius: 14px; }
  .face.plain .frame2 { position: absolute; inset: 34px; border: 1px solid rgba(230,200,130,.45); border-radius: 10px; }
  .face.plain .pnum { position: absolute; left: 0; right: 0; top: 120px; text-align: center; font: 400 64px 'Marcellus', serif; letter-spacing: .2em; color: #e8c983; }
  .face.plain .pstar { position: absolute; left: 50%; top: 50%; width: 150px; height: 150px; margin: -120px 0 0 -75px; }
  .face.plain .pname { position: absolute; left: 40px; right: 40px; top: 560px; text-align: center; font: 700 68px/1.3 'Zen Old Mincho', serif; letter-spacing: .1em; white-space: nowrap; color: #f1e6cf; }
  .face.plain .psuit { position: absolute; left: 0; right: 0; bottom: 110px; text-align: center; font: 500 34px 'Zen Kaku Gothic New', sans-serif; letter-spacing: .3em; color: rgba(232,201,131,.75); }
</style></head><body>
<div id="sky"></div>
<script src="params.js"></script>
<script src="film.js"></script>
</body></html>
